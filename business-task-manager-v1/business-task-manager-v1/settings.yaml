# V1: one fixed daily job trigger, one fixed recipient group.
workspace_host: https://dbc-f19e9824-546f.cloud.databricks.com
catalog: workspace
schema: douyin
schedule:
  timezone: Asia/Shanghai
  time: '09:00'
  business_date_offset_days: 487  # 09:00 checks the last completed day by default
notification:
  provider: outbox  # Later choose gmail after OAuth setup and approved rollout.
  legacy_alert_disabled: false
  email:
    enabled: false
    from_address: ''
    allowed_recipients: []
    max_messages_per_dispatch: 20
    max_attachment_bytes: 12582912
    max_message_bytes: 20971520
    templates:
      default:
        label: 标准业务报告
        file: templates/email/default.html.j2
    exports: {}  # Team-installed approved SELECT files; no invented business SQL.
  outbox_table: workspace.douyin.business_task_outbox_v1
  recipient_group: default
  max_report_chars: 12000
agents:
  genie_one:
    service: system.ai.genie_one_mcp
    # Host and user credentials come from the authenticated session, never a Space ID.

# 2C local implementation. No execution until explicitly enabled after rollout approval.
execution:
  enabled: false
  runs_table: workspace.douyin.business_task_runs_v1
registry:
  enabled: true
  table: workspace.douyin.business_task_registry_v1

# Creator delegation must be supplied by an approved identity resolver before unattended runs.
authorization:
  require_creator: true
